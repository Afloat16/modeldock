name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:openai-stdio
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:openai-browser
      - run: npm run test:comparison
      - run: npm run test:large
      - run: npm run test:openai-range
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: modeldock-vsix
          path: releases/*.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
  vscode:
    name: Native VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-native-results
          path: test-results/
          retention-days: 14
